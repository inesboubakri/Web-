    <div id="content-wrapper" class="d-flex flex-column">
      <div id="content">
        <!-- Topbar -->
        <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
          <button id="sidebarToggleTop" class="btn btn-link d-md-none rounded-circle mr-3">
            <i class="fa fa-bars"></i>
          </button>
        </nav>
        <!-- End of Topbar -->

        <!-- Begin Page Content -->
        <div class="container-fluid">
          <div class="d-sm-flex align-items-center justify-content-between mb-4">
            <h1 class="h3 mb-0 text-gray-800">Add a Travel Offer</h1>
          </div>

          <div class="card shadow mb-4">
            <div class="card-body">
              <form id="addTravelOfferForm" action="Verification.php" method="POST">
                <div class="form-group">
                  <label for="title">Offer Title</label>
                  <input type="text" id="title" name="title" class="form-control" required minlength="3" placeholder="Enter offer title">
                </div>

                <div class="form-group">
                  <label for="destination">Destination</label>
                  <input type="text" id="destination" name="destination" class="form-control" required pattern="[A-Za-z\s]{3,}" placeholder="Enter destination">
                </div>

                <div class="form-group">
                  <label for="departureDate">Departure Date</label>
                  <input type="date" id="departureDate" name="departureDate" class="form-control" required>
                </div>

                <div class="form-group">
                  <label for="returnDate">Return Date</label>
                  <input type="date" id="returnDate" name="returnDate" class="form-control" required>
                </div>

                <div class="form-group">
                  <label for="price">Price (€)</label>
                  <input type="number" id="price" name="price" class="form-control" required min="1" step="0.01" placeholder="Enter price">
                </div>

                <div class="form-group">
                  <label for="category">Category</label>
                  <select id="category" name="category" class="form-control" required>
                    <option value="">Select a category</option>
                    <option value="Luxury">Luxury</option>
                    <option value="Economy">Economy</option>
                    <option value="Adventure">Adventure</option>
                    <option value="Romantic">Romantic</option>
                    <option value="Family">Family</option>
                  </select>
                </div>

                <button type="submit" class="btn btn-primary">Add Offer</button>
              </form>
            </div>
          </div>
        </div>

      </div>
